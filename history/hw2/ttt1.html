<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DGMD E-28 Spring 2025 Assignment 2, ttt1, Karen Dolan</title>
    <style>
      .board {
        margin: auto;
        width: 360px;
      }
      .row {
        width: 100%;
      }
      .square {
        border: 1px solid black;
        width: 100px;
        height: 100px;
        margin: 5px;
        box-sizing: border-box; /* to include border in width and height */
        display: inline-block;
        font-size: 7rem;
        line-height: 6rem;
        text-align: center;
        vertical-align: top;
      }
      .square:hover {
        color: #7B28A1;
        background-color: #A9E101;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="board">
        <div class="row row-a">
          <div class="square square-1"></div>
          <div class="square square-2"></div>
          <div class="square square-3">
            X
          </div>
        </div>
        <div class="row row-b">
          <div class="square square-1"></div>
          <div class="square square-2"></div>
          <div class="square square-3"></div>
        </div>
        <div class="row row-c">
          <div class="square square-1">
            O
          </div>
          <div class="square square-2">
            X
          </div>
          <div class="square square-3"></div>
        </div>
    </div>
  </body>
</html>
