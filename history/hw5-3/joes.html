<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DGMD E-28 Spring 2025 Assignment 3 Joe's Hotdogs, Karen Dolan</title>
    <style type="text/css" media="screen">
      h1, h2 {
        text-align: center;
      }
      .invisible {
        display: none !important;
      }
      .alignRight {
        text-align: right;
      }
      .container {
        margin: 0 auto;
        max-width: 400px;
        position: relative;
      }
      .itemContainer, .menuItem, #addToCartContainer, #checkoutContainer {
        display: flex;
        justify-content: space-between;
        text-align: start;
        flex-direction: row;
      }
      #menuContainer, #addToCartContainer, #checkoutContainer, #popupContainer {
        border: 1px solid black;
        border-radius: 10px;
        margin: 5px;
        padding: 5px;
      }
      #newItem, #checkoutDisplay {
        flex-grow: 1;
        margin-right: 1rem;
      }
      #checkoutPopup {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #fff;
      }
    </style>
    <script>
        // ---------------------------- //
        // Setup
        // ---------------------------- //
        // Prompt text
        var INPUT_PROMPT = "Enter a menu item name";
        // The menu with items and prices
        var menu = {
          hotdogs: 4.00,
          fries: 3.50,
          soda: 1.50,
          sauerkraut: 1.00,
        };
        var cart = [];
        // Initialize the items in cart to 0
        Object.keys(menu).forEach((key) => {
            cart[key] = 0;
        });

        // ---------------------------- //
        // Header
        // Add a title to the page
        document.write( "<h1 class='title'>Assignment 3</h1><h2>Joe's Hotdogs!</h2>" );

        // ---------------------------- //
        // Create a container for the page content
        document.write( "<div class='container'>" );

        // ---------------------------- //
        // Create the Menu Area
        document.write( "<h4>Menu</h4>" );
        document.write( "<div id='menuContainer'>" );
        // List the menu items
        Object.keys(menu).forEach((item) => {
          document.write("<div class='menuItem'>");
          document.write("<div>" + item + "</div>");
          // Show price including cents (i.e. show 2 decimal places)
          document.write("<div>$" + menu[item].toFixed(2) + "</div>");
          document.write("</div>");
        });
        // End of menu container
        document.write( "</div>" );

        // ---------------------------- //
        // Create the Add to Cart Area
        document.write( "<h4>Add to Cart</h4>" );
        document.write( "<div id='addToCartContainer'>" );
        // Add an input area
        document.write( "<input id='newItem' type='text' placeholder='"+INPUT_PROMPT+"' />" );
        // Add the add to cart button
        document.write( "<button onClick='addToCart()' >Add to Cart</button>" );
        // Close the cart input area
        document.write( "</div>" );

        // ---------------------------- //
        // Create the Shopping Cart Display Area
        document.write( "<h4>Shopping Cart</h4>" );
        document.write( "<div id='checkoutContainer'>" );
        // Add the shopping cart display
        document.write( "<div id='cartDisplay'></div>" );
        // Add the checkout button, disable it until something has been added to cart
        document.write( "<button id='checkoutButton' disabled onClick='checkOut()'>Checkout</button>" );
        // Close the checkout area
        document.write( "</div>" );

        // ------------------------------- //
        // Create the Checkout Totals Popup Area
        document.write( "<div id='checkoutPopup' class='invisible'>" );
        // Title for the space
        document.write( "<h4>Total Cost</h4>" );
        // Add a container for the popup content
        document.write( "<div id='popupContainer'>" );
        // Show the total cost of each item
        document.write( "<div id='checkoutDisplay'></div>" );
        // Add the checkout total Ok button
        document.write( "<button id='popupButton' onClick='checkOutOk()'>Ok</button>" );
        // Close the popup content area
        document.write( "</div>" );
        // Close the popup element
        document.write( "</div>" );

        // ----------------------------------- //
        // Close the page content container
        document.write( "</div>" );

        // ---------------------------- //
        // Function to add to the cart
        // ---------------------------- //
        function addToCart() {
          var inputElement = document.getElementById('newItem')
          var item = inputElement.value.trim().toLowerCase();
          if (item in menu) {
            // Add the item to the cart
            cart[item] = ++cart[item];
            // Update the cart display
            updateCartDisplay();
            // Enable the checkout button
            document.getElementById('checkoutButton').disabled = false;
            // Clear the input
            inputElement.value = "";
            // Reset the input prompt
            inputElement.placeholder = INPUT_PROMPT;
          } else {
            // Clear the input
            inputElement.value = "";
            // Show the validation error in the input placeholder
            inputElement.placeholder = "Item '" + item + "' not found, try again!";
          }
        }
        // -------------------------------- //
        // Function to update shopping cart
        // -------------------------------- //
        function updateCartDisplay() {
          var cartDisplay = document.getElementById('cartDisplay');
          // Create the cart inner html from each object in cart
          cartDisplay.innerHTML = Object.keys(cart)
            // filter out items with 0 count
            .filter((item) => cart[item] > 0)
            // Show the amount of the item in the cart
            .map((item) =>  "<div>" + cart[item] + " " + item + "</div>")
            // flatten the array of string into a big string
            .join("");
        }

        // -------------------------------- //
        // Function to checkout
        // -------------------------------- //
        function checkOut() {
          // Make the checkout popup visible by changing it's classname
          var checkoutPopup = document.getElementById('checkoutPopup');
          checkoutPopup.classList.remove("invisible");
          // Get the total of all items
          var total = 0;
          Object.keys(cart).forEach((item) => {
            // multiple the amount of the item with it's cost
            total += cart[item] * menu[item];
          });
          // Show the totals
          var checkoutDisplay = document.getElementById('checkoutDisplay');
          // Fill in the html of the totals
          checkoutDisplay.innerHTML = Object.keys(cart)
            // filter out items with 0 count
            .filter(item => cart[item] > 0)
            // Show the total cost of the item, with cents precision
            .map((item) => "<div class='itemContainer'><div>" + cart[item] + " " + item + "</div><div>$" + (cart[item] * menu[item]).toFixed(2) + "</div></div>")
            // add a horizontal line
            .concat("<hr/>")
            // Add the grand total to the end of inner html element the array
            .concat("<div class='alignRight'>Total: $" + total.toFixed(2) + "</div>")
            // flatten the array into a big string
            .join("");
        }
        // ---------------------------------------------- //
        // Function for checkout Ok button to reset the cart
        // ------------------------------------------------ //
        function checkOutOk() {
          // Reset the cart to values 0
          Object.keys(menu).forEach((key) => {
            cart[key] = 0;
          });
          // Reflect the reset in the display
          updateCartDisplay();
          // Disable the checkout button until something has been added
          document.getElementById('checkoutButton').disabled = true;
          // Make the popup invisible again
          document.getElementById('checkoutPopup').classList.add("invisible");
        }
    </script>
  </head>
  <body id="body">
  </body>
</html>
