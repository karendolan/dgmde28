<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>DGMD E-28 Spring 2025 Assignment 5 Battleship, Karen Dolan</title>
      <style type="text/css" media="screen">
        .header, #button-container, #game-container {
          text-align: center;
        }
        .row {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
        }
        .square {
          border: 1px solid black;
          font-size: 2rem;
          line-height: 2rem;
          text-align: center;
          vertical-align: top;
          width: 60px;
          height: 60px;
          margin: 1px;
          border-radius: 5%;
        }
        .reveal {
          background-color: #0047AB
        }
        .hit {
          background-color: #DC143C;
        }
        .miss {
          background-color: #c1c2c7;
        }
      </style>
    </head>
    <body class="hw7">
      <div id="game-container">
      </div>
    <script>
      //TODO:
      //  In addition to the JSON to place the ships,
      //  each square could be an object and the “game” can be an object.
      //  Some suggested methods for the game object are buildBoard() and placeShips().
      // Game is over when all ships are sunk or 20 guesses used up
      // On game over, indicate the locations of the individual ships.
      // 1.	Of the object variations we have learned, which feels the most useful to you?
      // -- class is most intuitive
      // 2.	What was the easiest part of this assignment?
      // -- There was no easy part!!
      // 40% creativity/effort/code quality
      // ----------------------------- //
      //     Global Constants          //
      // ----------------------------- //
      // Global Game Variables
      var game;
      var ships = [];
      // Size constraints
      const BOARD_SIZE = 6; // 6x6
      const MAX_GUESSES = 20;

      // Temp to get past the cors error
      const data = {
        "ships":
        [
          {
            "name": "ship1",
            "orientation": "vertical",
            "size": 4,
            "coords": [2,3]
          },
          {
            "name": "ship2",
            "orientation": "horizontal",
            "size": 3,
            "coords": [3,3]
          },
          {
            "name": "ship3",
            "orientation": "vertical",
            "size": 2,
            "coords": [6,5]
          }
        ]
      };

      // -------------------------------------
      // Game Class
      // -------------------------------------
      class Game {
        // Private attributes
        #shipsJson;
        // track the ship objects
        #ships = [];
        // track guesses made
        #guesses = [];
        // track if game Over
        #isGameOver = false;

        // The constructor
        constructor(shipsJson){
          this.#shipsJson = shipsJson;
        }

        // Function
        playNewGame(shipsData) {
          console.log("Set up new game");
          this.#shipsJson = shipsData;
          this.#guesses = [];
          this.#isGameOver = false;
          this.reset();
        };

        // Optional toShow param to force revealing boats
        toggleDebugMode(toShow) {
          console.log("Show location of boats")
          this.#ships.forEach(ship => {
            console.log("Show location of ship ", ship);
            ship.toggleVisibility(toShow);
          })
        }

        reset() {
          // Reset message element
          const msgElem = document.getElementById('battleship_msg');
          msgElem.innerText = 'You have 20 guesses to find all ships!';
          // reset the guesses
          this.#guesses = [];
          // reset the ships
          this.#ships = [];
          this.placeShips();
          // reset the game squares
          for (let row = 1; row <= BOARD_SIZE; row++) {
            for (let col = 1; col <= BOARD_SIZE; col++) {
              // reset the square class name
              const squareId =  `row-${row}-col-${col}`;
              const square = document.getElementById(squareId);
              square.classList = `square row-${row}`;
            }
          }
        }

        // Function
        torpedoSquare(event) {
          // No more torpedos if game is over
          if (this.#isGameOver) return;
          // Get message element
          const msgElem = document.getElementById('battleship_msg');
          // Don't allow duplicate square clicks
          var square = event.target;
          if (this.#guesses.includes(square.id)) {
            msgElem.innerText = 'You already guessed this square, try another';
            return;
          }
          // Destructure the row and col coordinates
          var [,row,,col] = square.id.split("-");
          console.log('in torpedoSquare function ', row, col, this.#ships);

          // Save the square guessed
          this.#guesses.push(square.id);
          const guess = this.#guesses.length;
          // Iterate over ships to see if a hit
          var hitShip = this.#ships.find(ship => {
            return 'miss' !== ship.incoming([col,row]);
          });
          const status = hitShip ? 'hit' : 'miss';
          console.log("IsHit is ", status);
          // Color the square with the new classname
          square.classList.add(status);

          // Check if ships are still floating
          const floatingShip = this.#ships.find(ship => {
            return !ship.isSunk();
          })
          console.log(`Guesses ${guess} of ${MAX_GUESSES}, is floating ${!!floatingShip} last move was a ${status} `);
          if (!!floatingShip) {
            // Check if this was the last guess
            if (guess === MAX_GUESSES) {
              this.#isGameOver = true;
              msgElem.innerText = "Out of guesses! Play again";
              // Reveal ships if not already revealed
              game.toggleDebugMode(true);
            } else {
              msgElem.innerText = `That was a ${status}! You have ${MAX_GUESSES - guess} more guesses`;
            }
          } else {
            msgElem.innerText = `You sunk ALL my battleships in ${guess} guesses! Play again`;
            this.#isGameOver = true;
          }
        }

        // Function to read ship json and create ships
        placeShips() {
          this.#shipsJson.forEach(shipJson => {
            // Create ship object
            const ship = new Ship(shipJson);
            // Add ship to array
            this.#ships.push(ship);
          });


        }
      // End Game Class
      };

      // -------------------------------------
      // Ship Class
      // -------------------------------------
      class Ship {
        // Private attribute to track damage to ship
        // Holds coordinates of impact
        #hitCoords;
        // The constructor
        constructor ({name, size, orientation, coords}) {
          this.name = name;
          // number of squares 2-4
          this.size = size;
          // horizontal or vertical
          this.orientation = orientation;
          // where on the board, [col, row] (the first col,row is [1,1])
          this.coords = coords;
          // private attribute
          this.#hitCoords = [];
        }

        isSunk() {
          return this.#hitCoords.length == this.size;
        }

        toggleVisibility(toShow) {
          // Start position of ship
          console.log("About to reveal this", this);
          var [col, row] = this.coords;
          // Iterate over squares of the ship and reveal their location
          for (let i = 0; i < this.size; i++) {
            const squareId =  `row-${row}-col-${col}`;
            const square = document.getElementById(squareId);
            console.log("Show location of ", squareId, square.classList);
            if (square.classList.contains('reveal') && !toShow){
              square.classList.remove('reveal');
            } else {
              square.classList.add('reveal');
            }
            // If horizontal, move over a square
            if (this.orientation === 'horizontal'){
              col++;
            }
            // If vertical, move down a square
            if (this.orientation === 'vertical') {
              row++;
            }
          }

        }

        // Function to check on status of square in game
        // Returns: “hit”, “miss” or “sunk”
        incoming(coordsHit) {
          // Destructure col & row of torpedo strike
          var [colHit, rowHit] = coordsHit;
          // Start position of ship
          var [col, row] = this.coords;
          // Check the hit coordinate against each square of the ship
          for (let i = 0; i < this.size; i++) {
            var isHit = col == colHit && row == rowHit;
            if (isHit) {
              this.#hitCoords.push(coordsHit);
              if (this.#hitCoords.length ===  this.size) {
                return 'sunk';
              } else {
                return 'hit';
              }
            }
            // If horizontal, move over a square
            if (this.orientation === 'horizontal'){
              col++;
            }
            // If vertical, move down a square
            if (this.orientation === 'vertical') {
              row++;
            }
          }
          // Got through the checks without a hit!
          return 'miss';
        };
        // End of ship class
      };

      // ---- Global Function ------ //
      // Async because of fetching game JSON
      function playGame() {
        // Create the game instance if it doesn't exist
        if (!game) {
          game = new Game();
        }
        // Retrieve the game JSON
        console.log('About to get game data', window.location);
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'battleship.json', true);
        xhr.onload = function() {
          if (xhr.status === 200) {
            console.log(xhr.responseText);
          }
        };
        // TODO: debug this later with HTTP
        // xhr.send();

        // Start a new game
        console.log("About to start the game ", data.ships);
        game.playNewGame(data.ships);
      }
      // Option to debug the game
      function debugGame() {
        if (game) {
          game.toggleDebugMode();
        }
      }
      // Game square click handler
      function fireTorpedo(event) {
        if (game) {
          game.torpedoSquare(event);
        }
      }
      // Build more of the game
      function buildGameBoard() {
        // ---- Delete old Game Board -------- //
        var existingBoard = document.getElementById('game-container');
        if (existingBoard) {
          existingBoard.remove();
        }
        // ---- Create Game Board ------------ //
        // Start of the board
        document.write("<div id='game-container'>");
        document.write("<div id='game-board'>");
        // --- Validation message ----- //
        document.write( "<div id='validation'></div>" );
        // Create 6 rows of 6 input blocks
        for (let r = 1 ; r <= BOARD_SIZE ; r++) {
          document.write( "<div class='row' id='row-" + r + "'>" );
          // 5 columns
          for (let c = 1 ; c <= BOARD_SIZE ; c++) {
            const id = "row-" + r + "-col-" + c;
            document.write( "<div class='square row-" + r + "'  id='" + id + "'></div>" );
            const element = document.getElementById(id);
            const This = this;
            element.addEventListener("click", (event) => {
              fireTorpedo(event);
            })
          }
          // end row
          document.write( "</div>" );
        }
        // end game board div
        document.write("</div>");
        // end Game Container
        document.write("</div>");
      };

      // ---- Header  --------------- //
      // Add a titles to the page
      document.write("<div class='header'>")
      document.write("<h1>Battleship - Assignment 5 - Dolan</h1>" );
      document.write("<h3 id='battleship_msg'>You have 20 guesses to find all ships!</h3>");
      document.write("</div>");
      // --- Button container  --------
      document.write("<div id='button-container'>");
      // Refresh button
      document.write( "<button id='playNewGameButton'>Start New Game</button>" );
      // Debug button
      document.write( "<button id='debugButton'>Debug Option</button>" );
      document.write("</div>");
      // Create the initial game board
      buildGameBoard();
      // Set the play game button
      var gameButton = document.getElementById('playNewGameButton');
      gameButton.addEventListener("click", (event) => {
        playGame(event);
      });
      var gameButton = document.getElementById('debugButton');
      gameButton.addEventListener("click", (event) => {
        debugGame(event);
      });
      playGame();
    </script>
    </body>
</html>
