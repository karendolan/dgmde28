<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>DGMD E-28 Spring 2025 Assignment 2, Karen Dolan</title>
      <style>
        .container {
          width: 100%;
          margin: auto;
        }
        .row {
          position: relative;
          background-color: lightgray;
          margin: auto;
          display: block;

        }
        .square {
          position: absolute;
          border: 1px solid black;
          width: 100px;
          height: 100px;
          margin: 2.5px;
          box-sizing: border-box;
          display: inline-block;
        }
        .square-1 {
          top: 0;
          left: 0;
        }
        .square-2 {
          top: 0;
          left: 120px;
        }
        .square-3 {
          top: 0;
          left: 240px;
        }
        .marker {
          color: red;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="header">
          <h1 class="title">DGMD E-28 Spring 2025 - Homework &numero;2</h1>
        </div>
        <div class="board">
          <div class="row row-a">
            <div class="square square-1"></div>
            <div class="square square-2"></div>
            <div class="square square-3">
              <div class="marker ex">X</div>
            </div>
          </div>
          <div class="row row-b">
            <div class="square square-1"></div>
            <div class="square square-2"></div>
            <div class="square square-3"></div>
          </div>
          <div class="row row-c">
            <div class="square square-1">
              <div class="marker oh">O</div>
            </div>
            <div class="square square-2">
              <div class="marker ex">X</div>
            </div>
            <div class="square square-3"></div>
          </div>
      </div>
    </body>
</html>
