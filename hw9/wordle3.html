<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>DGMD E-28 Spring 2025 Assignment 7 Wordle Redux 2, Karen Dolan</title>
      <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
      <style type="text/css" media="screen">
        .header, #button-container {
          text-align: center;
        }
        #button-container button {
          margin: 5px;
        }
        button {
          padding: 8px;
          border-radius: 15%;
        }
        /* for hiding the debug text */
        .hidden {
          display: none;
        }
        /* to center all these elements */
        .row, #game-board, #guess-button-container, #key-board, .keyboard-row {
          margin: auto;
        }
        .row-container {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .guess-row {
          display: flex;
        }
        #game-key {
          width: 300px;
          margin: auto;
          padding: 10px;
          border: 1px solid black;
        }
        #debugText {
          color: #7B28A1;
        }
        #wordle-validation {
          font-size: 1.5rem;
          text-align: center;
          color: #7B28A1;
        }
        .square, .keyboard-key, .key-square {
          border: 1px solid black;
          font-size: 2rem;
          line-height: 2rem;
          text-align: center;
          vertical-align: top;
        }
        .key-square {
          display: inline-block;
        }
        .square {
          width: 60px;
          height: 60px;
          margin: 5px;
          border-radius: 5%;
        }
        .keyboard-key {
          width: 30px;
          height: 30px;
          margin: 1px;
          border-width: 0;
          font-size: 1.3rem;
          line-height: 1.3rem;
          align-content: center;
          border-radius: 20%;
        }
        .key-square {
          width: 20px;
          height: 20px;
          margin: 1px;
          margin-right: 3px;
          border-width: 0;
          font-size: 1.5rem;
          line-height: 1.5rem;
          border-radius: 20%;
        }
        .keyboard-row {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
        }
        .rightLetterWrongSpot {
          color: white;
          background-color: #c9b458;
        }
        .rightLetterRightSpot {
          color: white;
          background-color: #6aaa64;
        }
        .wrongLetter {
          color: white;
          background-color: #787c7e;
        }
      </style>
    </head>
    <body>
      <div id="myapp"></div>
      <script type="text/babel">
      /**
       * Practice using React JSX to create the Wordle board.
       * The spec is exactly the same for the last assignment
       *  – but this time, use JSX only!
       *
       * 1.  Use React to create
       * 1.a The Wordle board (6 words of 5 letters each)
       * 1.b The on-screen keyboard
       *
       * 2. hard code 3 guesses (“might”, “flood”, “stray”)
       * and then calculate and display results against an answer of “moody”
       *
       * We will be looking for use of components. This assignment should not use JSX.
       *
       * Question: Which seems better for creating the elements of the app:  JS alone or JS with React
       *  JS with React is better because I don't have to worry about placing the closing div when nesting elements.
       *
       * Question: Which seems better for creating the elements of the app:
       *  JS alone or JS with React?
       *
       PDF with:
          URL
          Copy of the code
          Answer to the question:
          Which seems better for creating the elements of the app: JS alone or JS with React?
          Rubric
          Works to spec 65%
          Good use of JSX 35%
       */
       /**
       * ----------------------------
       * Game Global Constants
       * ----------------------------
       */
       var THREE_GUESSES = ["MIGHT", "FLOOD", "STRAY"];
       var WORD_TO_GUESS = "MOODY";
             // Size constraints
      const MAX_GUESSES = 6;
      const WORD_SIZE = 5;
      // ----- Key Board  ----------- //
      // This is the QWERTY display used in NYTimes wordle
      const KEYBOARD_ROW_1 = "qwertyuiop".toUpperCase();
      const KEYBOARD_ROW_2 = "asdfghijkl".toUpperCase();
      const KEYBOARD_ROW_3 = "zxcvbnm".toUpperCase();
      const ALL_LETTERS = KEYBOARD_ROW_1 + KEYBOARD_ROW_2 + KEYBOARD_ROW_3;
      // This is for showing the QUERTY keyboard for guessed keyboard letters
      const KEYBOARD_KEYS = [KEYBOARD_ROW_1, KEYBOARD_ROW_2, KEYBOARD_ROW_3];
      // Toggle to start game with debug on
      const IS_DEBUG_ON = true;

      /**
       * ----------------------------
       * Game Header title - JSX
       * ----------------------------
       */
      function Title({isDebugOn, wordToGuess} ) {
        // Create instructions
        var instruction = (
          <h2>
            You have 6 tries to guess a 5 letter word!
          </h2>
        );
        // Create show guess work, if Debug is on
        var debugElem = isDebugOn ? (
          <div className="display" id="debugText">
            The word to guess is:
            <span>
              {wordToGuess}
            </span>
          </div>
        ) : null;
        // Create Main title
        var title =  (
          <h1>
            Wordle Redux #2 - Assignment 7 - Dolan
          </h1>
        );
        // Return the header title container
        return (
          <div className="header">
            {title}
            {instruction}
            {debugElem}
          </div>
        );
      }

       /**
       * ----------------------------
       * Legend Key for the colors
       * ----------------------------
       */
      function Legend() {
        var legendClasses = [
          {
            class: "rightLetterRightSpot",
            text: "The letter is in the word in the right spot",
          },
          {
            class: "rightLetterWrongSpot",
            text: "The letter is in the word, but not this spot",
          },
          {
            class: "wrongLetter",
            text: "This letter is not part of the word",
          },
        ];
        // Return the combined JSX
        return (
          <div id="game-key">
            <h4>
              Color Legend
            </h4>
            {legendClasses.map((item) => (
              <>
                {/* The color code box */}
                <span className={`key-square ${item.class}`} />
                {/* The color code description */}
                {item.text}
              </>
            ))}
          </div>
        );
      };

       /**
       * ----------------------------
       * Component Square
       * props:{col, row}
       * ----------------------------
       */
       function Square(props) {
        // Destructure props
        const {
          col,
          row,
          className = 'square',
          value,
        } = props;
        // attributes
        this.col = col;
        this.row = row;
        this.id = `square-col-${col}-row-${row}`;
        // Return element
        return React.createElement(
          'input',
          {
            className,
            id: this.id,
            type: "text",
            maxLength: 1,
            value,
            readOnly: true
          },
          null
        );
       }

      /**
       * ----------------------------
       * CLASS Guess Row
       * Now extends a React.Component
       * ----------------------------
       */
       class GuessRow extends React.Component {
        // The constructor for this class
        constructor (props) {
          super(props);
          console.log("This", this);
          const {rowNum, squareCount, wordToGuess, guessWord} = props;
          this.rowNum = rowNum;
          this.squareCount = squareCount;
          this.wordToGuess = wordToGuess;
          // Optional hard coding this for this assignment
          this.guessWord = guessWord;
        }
        // The function to render the JSX of this component
        render() {
          // A holder for the square elements
          var squareElems = [];
          // Create a Square object for for each square in the row
          for (let col = 0; col <  this.squareCount; col++) {
            // Create the props for the Square object
            var props = {
                  key: `${col}-${this.rowNum}`,
                  row: this.rowNum,
                  col,
                  className: "square"
                };
            // If a guess word exists for this row,
            // update the square with the letter and code
            if (this.guessWord) {
              var g = this.guessWord;
              var w = this.wordToGuess;
              // console.log("Words ", g, col, g[col], w, w[col])
              props.value = g[col];
              if (g[col] === w[col]) {
                props.className += " rightLetterRightSpot";
              } else if (w.includes(g[col])) {
                props.className += " rightLetterWrongSpot";
              } else {
                props.className += " wrongLetter";
              }
            }
            // Add the square React element to the array
            squareElems.push(
              React.createElement( Square, props, null )
            );
          }
          // Return element
            return (
            <div className="guess-row">
              squareElems - TODO here
            </div>
          )
        };
      }

      /**
       * ----------------------------
       * Component Board
       * props:{dimension}
       * ----------------------------
       */
       function Board({
          wordSize,
          maxGuesses = 6,
          wordToGuess,
          guesses,
          isDebugOn = false,
       }) {
        // Create all the row elements
        var rows = [];
        for (let rowNum = 0; rowNum < maxGuesses; rowNum++) {
          var row = new GuessRow({
            rowNum,
            wordSize,
            wordToGuess,
            guessWord: guesses[rowNum],
          })
          // rows.push(row.getElement());
          rows.push(
            <div>empty</div>
          )
        }
        // Create the square row container
        var rowContainer = (
          <div className="row-container">
            {rows}
          </div>
        );
        // Create keyboard
        var keyboard = new Keyboard({wordToGuess, guesses});
        // Create Title
        var title = new Title({isDebugOn, wordToGuess});
        // Create Legend
        var legend = new Legend();

        // Return game board with it's nested components
        return (
        <div id="game-board">
          {title}
          {rowContainer}
          {keyboard}
          {legend}
        </div>
        )
      }

      /**
       * ----------------------------
       * Component On-Screen Keyboard
       * ----------------------------
       */
       function Keyboard(props) {
        // Destructure props
        var {wordToGuess, guesses} = props;
        // Key board container element
        var rows = [];
        KEYBOARD_KEYS.forEach((rowStr, rowNum) => {
          var keys = [];
          rowStr.split('').forEach((letter, index) => {
            var props = {
                  key: index,
                  className:'keyboard-key',
                  id: `key-${letter}`
                };
            // If a guess word exists for this row,
            // update the square with the letter and code
            if (guesses && guesses.length > 0) {
              // Is this letter in any of the guesses?
              if (guesses.join('').includes(letter)) {
                // Is this letter also in the word to guess?
                if (wordToGuess.includes(letter)) {
                  var isMatch = guesses.find(guess => {
                    var m = Array.from(guess).find((char, index) => {
                      // console.log("TESTING ", char, letter, wordToGuess[index] );
                      return char === letter && wordToGuess[index] === letter
                    })
                    return m;
                  });
                  props.className += isMatch ? " rightLetterRightSpot" : " rightLetterWrongSpot";
                  // console.log(" MATCH? ",  props.className, letter, wordToGuess);
                } else {
                  props.className += " wrongLetter";
                }
              }
            }
            // push the new keyboard key
            keys.push(
              React.createElement(
                'div',
                props,
                letter.toUpperCase())
            );
          })
          // push the new keyboard row
          rows.push(
            React.createElement(
              'div',
              {
                key: rowNum,
                className: 'keyboard-row',
                id: `keyboard-row-${rowNum}`
              },
              keys
            )
          );
        })
         // Return keyboard with it's nested rows
         return React.createElement('div', {id: 'keyboard'}, rows);
       }

       // ----------------------------
       // Game entry
       // ----------------------------

       const game = (
        <Board
          wordSize={WORD_SIZE}
          maxGuesses={MAX_GUESSES}
          wordToGuess={WORD_TO_GUESS}
          guesses={THREE_GUESSES}
          isDebugOn={IS_DEBUG_ON}
        />
       );
      ReactDOM.render(game, myapp);
     </script>
    </body>
</html>
