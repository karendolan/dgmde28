    <style type="text/css" media="screen">
      /* Make the body skinny to force the blocks to wrap every 3rd block */
      body {
        margin: 0 auto;
        max-width: 400px;
      }
      h1, h2 {
        text-align: center;
      }
      .square {
        border: 1px solid black;
        width: 100px;
        height: 100px;
        margin: 5px;
        box-sizing: border-box; /* to include border in width and height */
        display: inline-block;
        font-size: 7rem;
        line-height: 6rem;
        text-align: center;
        vertical-align: top;
      }
      .square:hover {
        color: #7B28A1;
        background-color: #A9E101;
      }
      .square.winner {
        color: #A9E101;
        background-color: #7B28A1;
      }
      .resetButton {
        font-size: 1.2rem;
        border-radius: 10%;
        background-color: #A9E101;
      }
      .resetButton:hover {
        color: white;
        background-color: #7B28A1;
      }
      .indicatorBox {
        border: 1px solid black;
        width: 160px;
        height: 200px;
        display: inline-block;
        text-align: center;
        margin: 5px;
        font-size: 3rem;
        background-color: #111;
      }
      .messageBoxContainer, .squareContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
      }
      #turn {
        color: #fff;
      }
      #win {
        color: #7B28A1;
        background-color:  #fff;
      }
      #popup {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        color:  #A9E101;
        background-color:  #7B28A1;
        font-size: 3rem;
        z-index: 1000;
        border-radius: 1rem;
        text-align: center;
      }
    </style>
    <script>
        // ---------------------------- //
        // Build the Game board
        // ---------------------------- //
        // Create 9 tic tac toe squares
        const NUM_SQUARES = 9;
        // Create an initial status for the game
        var isGameOver = false;
        // Create a variable to track whose turn it is
        var turnIndicator;
        // Add a title to the page
        document.write( "<h1 class='title'>Assignment 4</h1><h2> Tic Tac Toe part C</h2>" );
        // Add a hidden popup div to use for the popup message
        document.write( "<div id='popup'></div>" );
        // Create 9 tic tac toe squares
        document.write( "<div class='squareContainer'>" );
        for (let i=0; i<NUM_SQUARES; i++)
        {
            id = "sq"+i;
            document.write( "<div class='square' id='" + id + "'></div>" );
        }
        document.write( "</div>" );
        document.write( "<div class='messageBoxContainer'>" );
        // Add a box to indicate if it's X or O's turn
        document.write( "<div class='indicatorBox' id='turn'></div>" );
        // Add a box to indicate who won
        document.write( "<div class='indicatorBox' id='win'></div>" );
        document.write( "</div>" );
        // Initialize game play text
        initiateGame();


        // ---------------------------- //
        // Function to set the start of the game
        // ---------------------------- //
        function initiateGame() {
          // Clear all the square values
          var squares = document.querySelectorAll(".square");
          Array.from(squares).map(square => {
            // Clean out the square value
            square.innerHTML = "";
            // Clean up any previous winner squares
            square.classList.remove("winner");
          });
          // Randomly assign first move and tracks whose turn it is (Fixed from HW3)
          var randomInt = Number.parseInt(Math.random() * 100);
          turnIndicator = randomInt % 2 == 0 ? "X" : "O";
          // Show who's turn it is to start the game
          document.getElementById('turn').innerHTML = turnIndicator + "'s Turn";
          // Set the In play text in the status indicator box
          document.getElementById('win').innerHTML = "In Play";
          // Set the game over status
          isGameOver = false;
        }

        // -------------------------------- //
        // Function to check game status
        // ---------------------------- //
        function checkStatusOfGame() {
          // Placeholder for the moves
          var moves = [];
          // Placeholder for the end game conditions
          var isXwin;
          var isOwin;
          var isDraw;
          // Get all the squares
          var squares = document.querySelectorAll(".square");
          // Map the contents of the square into the moves array
          var moves =  Array.from(squares).map(square => {
            var move = square.innerHTML;
            // Return the value or a dash if there is no move in this square
            var value = ["X", "O"].includes(move) ? move : "-";
            return value;
          })
          // ---------------------------- //
          // Check all the possible win conditions
          var winConditionCount = 0;
          var maxWinConditions = 8;

          // ---------------------------- //
          // Re-wrote my previous brute force winConditions array
          // to track the square position
          // so that the winning squares can be highlighted
          var winConditions = [
            // Horizontal 1-3
            [0,1,2],
            [3,4,5],
            [6,7,8],
            // Diagonal 4-5
            [0,4,8],
            [2,4,6],
            // Vertical 6-8
            [0,3,6],
            [1,4,7],
            [2,5,8]
          ];

          // ---------------------------- //
          // Iterate over each type of win condition to check for a winner
          winConditions.find(winCondition => {
            // Get the string of the square values for the square numbers in this win condition
            var value = winCondition.map(index => moves[index]).join("");
            isXwin = value === "XXX";
            isOwin = value === "OOO";
            // Set the winning squares to have a different style
            if (isXwin || isOwin) {
              winCondition.forEach(i => {
                var square = document.getElementById('sq' + i);
                square.classList.add("winner");
              });
              // Break from this loop, found the winner!
              return true;
            }
            // Continue looking at next condition
            return false;
          });

          // ---------------------------- //
          // If no winner, check if it's a draw
          if (!isXwin && !isOwin) {
            var notDraw = moves.find(move => move === "-");
            isDraw = !notDraw;
          }

          // Set the game over status
          isGameOver = isXwin || isOwin || isDraw;
          if (isGameOver) {
            // Add a replay button
            document.getElementById('turn').innerHTML = "Game Over!<button class='resetButton' onclick='initiateGame()'>Play again</button>";
          }
          if (isXwin || isOwin) {
            document.getElementById('win').innerHTML = turnIndicator + " Won";
          } else if (isDraw) {
            document.getElementById('win').innerHTML = " The game is a draw";
          }
          return isGameOver;
        }

        // ---------------------------- //
        // function to add an X or O to a square
        // ---------------------------- //
        function addValue(squareNumber)
        {
            // Cannot make a move if the game is not in play
            if (isGameOver) return;
            // Get the square of interest
            square = document.getElementById('sq' + squareNumber);
            // If the square is already filled, don't do anything
            if (square.innerHTML != "") {
                return;
            };
            // Add the correct value into the square
            square.innerHTML = turnIndicator;
            // Check the status of the game
            var isOver = checkStatusOfGame();
            if (!isOver) {
              // Toggle the turn indicator
              turnIndicator = turnIndicator == "X" ? "O" : "X";
              // Show whos turn is next
              document.getElementById('turn').innerHTML = turnIndicator + "'s Turn";
            }
        }

        // ---------------------------- //
        // Add a click event handler to each square
        // ---------------------------- //
        for (let i=0; i<NUM_SQUARES; i++)
        {
            square = document.getElementById('sq' + i);
            square.addEventListener("click", () => addValue(i));
        }
    </script>
