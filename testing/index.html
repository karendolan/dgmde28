        // ---- define a nav object -----
        function LinkObj(navLabel, isExternal, url) {
          this.navLabel = navLabel;
          this.isExternal = isExternal;
          this.url = url;
        }
        // ---- create an array of nav objects ----
        var navData = [
          new LinkObj("Weather", true, "https://weather.com"),
          new LinkObj("News", true, "https://npr.org"),
          new LinkObj("Sports", true, "https://espn.com"),
        ];
        // ---- create an ordered list of anchor tags for each nav object ---
        var navListElement = React.createElement(
          "ol",
          null,
          navData.map((item,i) =>
              React.createElement(
                "li",
                // Each li child in the ordered list needs a unique key
                {key: "li-" + i},
                React.createElement(
                  "a",
                  {
                    // No key needed since only one anchor child per li
                    href:item.url,
                    target: item.isExternal ? '_blank' : ''
                  },
                  item.navLabel
                )
              )
          )
        );
        ReactDOM.render(navListElement, myapp);
