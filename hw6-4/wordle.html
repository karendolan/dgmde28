<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DGMD E-28 Spring 2025 Assignment 4 Wordle, Karen Dolan</title>
    <style type="text/css" media="screen">
      .header, #button-container {
        text-align: center;
      }
      #button-container button {
        margin: 5px;
      }
      .hidden {
        display: none;
      }
      #game-board, #guess-button-container, #key-board, .keyboard-row {
        width: fit-content;
        margin: auto;
      }
      #wordle-validation {
        text-align: center;
        color: #7B28A1;
      }
      .square, .keyboard-key {
        border: 1px solid black;
        width: 60px;
        height: 60px;
        margin: 5px;
        box-sizing: border-box; /* to include border in width and height */
        display: inline-block;
        font-size: 2rem;
        line-height: 2rem;
        text-align: center;
        vertical-align: top;
        border-radius: 5%;
      }
      .keyboard-key {
        width: 50px;
        height: 50px;
        margin: 3px;
        border-radius: 20%;
        border-width: 0;
        font-size: 1.5rem;
        line-height: 1.5rem;
        align-content: center;
      }
      .rightLetterWrongSpot {
        color: white;
        background-color: #c9b458;
      }
      .rightLetterRightSpot {
        color: white;
        background-color: #6aaa64;
      }
      .wrongLetter {
        color: white;
        background-color: #787c7e;
      }
    </style>
  </head>
  <body id="body">
    <div></div>
    <script>
      // ----------------------------- //
      // --- Game Constants   -------- //
      // ---------------------------- //
      const MAX_GUESSES = 6;
      const WORD_SIZE = 5;
      // ----- Key Board  ----------- //
      const KEYBOARD_ROW_1 = "qwertyuiop".toUpperCase();
      const KEYBOARD_ROW_2 = "asdfghijkl".toUpperCase();
      const KEYBOARD_ROW_3 = "zxcvbnm".toUpperCase();
      const ALL_LETTERS = KEYBOARD_ROW_1 + KEYBOARD_ROW_2 + KEYBOARD_ROW_3;
      const KEYBOARD_KEYS = [KEYBOARD_ROW_1, KEYBOARD_ROW_2, KEYBOARD_ROW_3];
      // Store potential 5 letter words to cut down on API calls
      const potentialWordsForGame = ["APPLE", "GRIPE", "PLATE"];
      // Keep track of previous game words used in current session to avoid reusing
      const usedWordsForGame = [];

      // ---------------------------------- //
      // ---------------------------------- //
      // --- Wordle Game Class ------------ //
      // --------------------------------- //
      // ---------------------------------- //
      class Wordle {
        // ------------------------------  //
        // The constructor with defaults   //
        // ------------------------------ //
        constructor (
          wordToGuess = "APPLE",
          wordSize = WORD_SIZE,
          maxGuesses = MAX_GUESSES,
          allLetters = ALL_LETTERS,

        ) {
          if (wordToGuess.length !== wordSize) {
            console.error("Wrong word length");
            return;
          } else {
            console.log("Word to guess is ", wordToGuess);
          }
          // Ensure upper case
          this.wordToGuess = wordToGuess.toUpperCase();
          this.wordSize = wordSize;
          this.maxGuesses = maxGuesses;
          this.guessCount = 0;
          this.prevGuesses = [];
          this.isEnded = false;
          this.curGuess = [];
          // Create an empty map for hits or misses on letters
          this.keyMap = ALL_LETTERS.split('').map((letter) => {
            return {[letter]: '' };
          })
          // Build or refresh game board
          this.start();
        }

        // ------------------------------------------  //
        // Function to verify letter and put it upper case
        // ------------------------------------------- //
        onChangeValue(event) {
          const {
            data,
            target,
          } = event;
          const {
            id,
          } = target;
          const curValue = data?.toUpperCase();
          if (ALL_LETTERS.includes(curValue)) {
            document.getElementById(id).value = curValue;
            // Move focus if not at end of word
            const curId = Number.parseInt(id.split('-sq-')[1]);
            // If a valid letter was entered, move focus to next square to right
            if (curId < WORD_SIZE - 1) {
              const nextId = id.replace(`sq-${curId}`, `sq-${curId + 1}`);
              let nextSquare =  document.getElementById(nextId);
              nextSquare.focus();
            }
            this.curGuess[curId] = curValue;
          } else {
            // remove existing value if it exists
            document.getElementById(id).value = '';
          }
        }

        // ------------------------------ //
        // Function to submit a guess
        // ------------------------------ //
        submitGuess() {
          const guess = this.curGuess.join('');
          const msgElem = document.getElementById('wordle-validation');
          const rowNum = this.prevGuesses.length;
          console.log("SUBMIT guess ", this.curGuess, guess, ", word to guess ", this.wordToGuess, this );
          // -------------------------
          // Validate entry
          // --------------------------
          // Validate guess is 5 letters
          if (guess.length !== 5) {
            msgElem.innerHTML = ('Guess must be 5 letters');
            return;
          }
          // Don't allow a duplicate guess
          if (this.prevGuesses.includes(guess)) {
            msgElem.innerHTML = (`You already guessed "${guess}", try a different word`);
            return;
          }
          // Guess must be a valid word
          if (false) {
            msgElem.innerHTML = (`The word "${guess}" is not recognized, try a different word`);
            return;
          }
          // -------------------
          // VALID checks passed
          // -------------------
          // Freeze the input blocks in the current row
          const blocks = document.getElementsByClassName("row-" + rowNum);
          for (let block of blocks) {
            block.disabled = true;
          }
          // Copy word to guess in to a temp comparator so that letters can be removed
          // as matches are made in the current word
          const lettersToGuess = this.wordToGuess.split('');
          // Temp container to hold the match, miss, or no match results for each position
          const lettersGuessedResult = [];
          // First Check for letter matches in right spot
          this.curGuess.forEach((letter, i) => {
            console.log("SUBMIT testing for direct match: ", i, ", letter  ", letter, ", against ", lettersToGuess[i] );
            // Is a match in right space?
            if (lettersToGuess[i] === letter) {
              // Remove direct match letter from comparator
              lettersToGuess[i] = '';
              // match
              lettersGuessedResult[i] = "rightLetterRightSpot";
              this.keyMap[letter] = lettersGuessedResult[i];
              // Refresh letter match color
              blocks[i].classList.add(lettersGuessedResult[i]);
              // Refresh the key match color
              const keyElem = document.getElementById("key-" + letter);
              keyElem.classList = `keyboard-key ${this.keyMap[letter] }`;
              console.log("Is match");
            } else {
              console.log("Is not match");
            }
          });
          // Next, Check for matches in the wrong place
          this.curGuess.forEach((letter, i) => {
            console.log("SUBMIT testing non direct match: ", i, ", letter  ", letter, ", against ", lettersToGuess );
            if (lettersToGuess.includes(letter)) {
              console.log("Is non-direct match");
              // Remove this match letter from comparator
              const position = lettersToGuess.indexOf(letter);
              lettersToGuess[position] = '';
              // The "rightLetterRightSpot" overrides rightLetter wrong spot
              if (lettersGuessedResult[i] !== "rightLetterRightSpot") {
                lettersGuessedResult[i] = "rightLetterWrongSpot";
              }
              // Update this letter block class
              blocks[i].classList.add(lettersGuessedResult[i]);
              // Only update key if it isn't a right spot match
              if (this.keyMap[letter] !== "rightLetterRightSpot" ) {
                // Only update if not previous right
                this.keyMap[letter] = "rightLetterWrongSpot";
                // Refresh the key match color
                const key = document.getElementById("key-" + letter);
                key.classList = `keyboard-key ${this.keyMap[letter]}`;
              }
            } else if (!lettersGuessedResult[i]) {
              console.log("Is no match");
              // Refresh letter match color
              blocks[i].classList.add("wrongLetter");
              // Update key if not already set to something else
              if (!this.keyMap[letter]){
                this.keyMap[letter] = "wrongLetter";
                const key = document.getElementById("key-" + letter);
                key.classList = `keyboard-key ${this.keyMap[letter]}`;
              }
            }
          })
          // Add this guest to list of guesses
          this.prevGuesses.push(guess);

          // Show win message!!!
          if (guess === this.wordToGuess) {
            msgElem.innerHTML = (`You win!!! You won in ${this.prevGuesses.length} tr${this.prevGuesses.length > 1 ? 'ies' : 'y'}`);
            this.isEnded = true;
          }
          // Check the hit and miss count
          else if (this.prevGuesses.length === this.maxGuesses) {
            msgElem.innerHTML = (`You are out of guesses. The word to guess was ${this.wordToGuess}`);
          }
          else {
            msgElem.innerText = (`Keep trying! You have ${MAX_GUESSES - this.prevGuesses.length} more guesses`);
            // UnFreeze the next row
            const nextBlocks = document.getElementsByClassName(`row-${rowNum + 1}`);
            for (let block of nextBlocks) {
              block.removeAttribute("disabled");
            }
            const focusBlock = document.getElementById(`row-${rowNum + 1}-sq-0`);
            focusBlock.focus();
          }
        }
        // -------------------------------------
        // function to refresh or build game board
        // -------------------------------------
        start() {
          // Reset board if it already exists, otherwise build it
          let isFirstBuild = true;
          let isRefresh = document.getElementById('game-board');
          if (isRefresh) {
            // Refresh board
            this.refreshBoard();
          } else {
            // Build from scratch
            this.buildGameBoard();
          }
        }
        // --------------------------
        // function to refresh values on board game
        // ---------------------------
        refreshBoard() {
          // Refresh keyboard values
          KEYBOARD_KEYS.forEach((rowStr, i) => {
            rowStr.split('').forEach((letter) => {
              const keyBlock = document.getElementById(`key-${letter}`);
              // Set to default class
              keyBlock.className = "keyboard-key";
            })
          })
          // Refresh board row values
          for (let r = 0 ; r < this.maxGuesses ; r++) {
            for (let c = 0 ; c < this.wordSize ; c++) {
              const id = "row-" + r + "-sq-" + c;
              const letterBlock = document.getElementById(id);
              // Set to block's default class
              letterBlock.className = `square row-${r}`;
              // unset the value
              letterBlock.value = '';
              // Disable all squares but those in the first row
              const disabled = r > 0 ? 'disabled' : '';
              letterBlock.disabled = disabled;
              // Remove existing listeners from the previous object
              letterBlock.removeEventListener("input", (event) => {
                onChangeValue(event);
              })
              // Add the new event listener that will point to this Wordle Class
              letterBlock.addEventListener("input", (event) => {
                // Calls the global var that passes back to this Wordle object
                onChangeValue(event);
              })
            }
          }
          // Refresh message
          const msgElem = document.getElementById('wordle-validation');
          msgElem.innerHTML = '';
          // Set focus on first block
          const firstBlock = document.getElementById('row-0-sq-0');
          firstBlock.focus();
        };
      }
      // ----------------------------- //
      // --- END OF Wordle CLASS ------//
      // ----------------------------- //

      // Global variable
      var game;

      // ---------------------
      // Global functions
      // ---------------------

      // Handler for debugging the game
      function debugGame() {
        const debugWordElem = document.getElementById("debugText");
        // Toggle visibility
        debugWordElem.className = debugWordElem.className === "hidden" ? "" : "hidden";
      }

      // Handler for initiating a new Wordle game
      async function playNewGame() {
        // TODO: get from api
        const wordToGuess = await getWordToGuess();
        console.log("The wordToGuess is " + wordToGuess + ".");
        // const wordToGuess = potentialWordsForGame.length > 0 ? potentialWordsForGame.pop() : "LATER";
        usedWordsForGame.push(wordToGuess);
        console.log("New GAME ", wordToGuess, ", used", usedWordsForGame, ", potential", potentialWordsForGame);
        // set the debug area
        const debugWordElem = document.getElementById("wordToGuess");
        debugWordElem.innerText = wordToGuess;
        // create a new game
        game = new Wordle(wordToGuess);
      }

      // Handler for changing the value in a square
      function onChangeValue(event) {
        game.onChangeValue(event);
      }

      // Handler for submitting the guess
      function submitGuess() {
        console.log("Submitting on wordle ", game);
        game.submitGuess();
      }

      // Function to get word to guess
      // Calls out to the Datamuse API
      // Returns a semi-random 5 letter work
      async function getWordToGuess() {
        // Variable for the word to guess
        var word;
        // Get a random letter from the alphabet
        var randomInt = Number.parseInt(Math.random() * 100);
        // Get a random number 0-24
        var randomIntTo24 = randomInt % 25;
        // Use the random index to get a letter
        var randomLetter  = ALL_LETTERS[randomIntTo24];
        // Fetch a set of 5 letter words from DataMuse that start with the randomLetter
        const res = await fetch(`https://api.datamuse.com/words?sp=${randomLetter}????`)
          .then (res => res.text())
          .then (data =>
          {
            console.log("Data ", data);
            data = JSON.parse(data);
            console.log("parsed Data ", data);
            // Find the first candidate that is all letters
            dataCandidate = data.find(candidate => {
              // Return true if the candidate is all 5 letters, otherwise false
              // This excludes words like "X-RAY"
              return candidate.word.toUpperCase().match('([A-Z]{5})');
            });
            // Retrieve the word
            word = dataCandidate.word.toUpperCase();
            console.log("The current word is " + dataCandidate.word + ".");
          })
          .catch (error => console.log(error));
          // The word should be upper case
          return word.toUpperCase();
      };

      // -------------------------------------
      // function to build game board
      // This has to be called while the page is still loading
      // Prior to doing an async on getting the word for Wordle
      // -------------------------------------
      function buildGameBoard() {
        // ---- Create Game Board ------------ //
        console.log("document: ", document);
        document.write("<div id='game-container'>");
        document.write("<div id='game-board'>");
        // --- Validation message ----- //
        document.write( "<div id='wordle-validation'></div>" );
        // Create 6 rows of 5 input blocks
        for (let r = 0 ; r < MAX_GUESSES ; r++) {
          document.write( "<div class='row' id='row-" + r + "'>" );
          // 5 columns
          for (let c = 0 ; c < WORD_SIZE ; c++) {
            const id = "row-" + r + "-sq-" + c;
            // Disable all squares but those in the first row to start
            const disabled = r > 0 ? 'disabled' : '';
            document.write( "<input type='text' maxlength='1' class='square row-" + r + "' " + disabled + "  id='" + id + "'/>" );
            const element = document.getElementById(id);
            element.addEventListener("input", (event) => {
              this.onChangeValue(event);
            })
          }
          // end row
          document.write( "</div>" );
        }
        // end game board div
        document.write("</div>");
        // Key board container element
        document.write("<div id='keyboard'>");
        KEYBOARD_KEYS.forEach((rowStr, i) => {
          document.write( "<div class='keyboard-row' id='keyboard-row-" + i + "'>" );
          rowStr.split('').forEach((letter) => {
            document.write("<div class='keyboard-key' id='key-" + letter + "'>" + letter.toUpperCase() + "</div>");
          })
          // end keyboard row
          document.write("</div>");
        })
        // end key board div
        document.write("</div>");
        // end Game Container
        document.write("</div>");
      };


      // ---- Header  --------------- //
      // Add a titles to the page
      document.write("<div class='header'>")
      document.write("<h1 class='title'>Assignment 4</h1>");
      document.write("<h2>Wordle</h2>" );
      document.write("<h3>You have 6 tries to guess a 5 letter word!</h3>");
      // Debug option
      document.write("<div id='debugText' class='hidden'>The word to guess is \"<span id='wordToGuess'></span>\"</div>");
      document.write("</div>");
      // --- Button container  --------
      document.write("<div id='button-container'>");
      // Refresh button
      document.write( "<button id='playNewGameButton' onClick='playNewGame()'>Start New Game</button>" );
      // Debug button
      document.write( "<button id='debugButton' onClick='debugGame()'>Debug Option</button>" );
      // Submit button
      document.write( "<button id='submitGuessButton' onClick='submitGuess()'>Submit Guess</button>" );
      // end Guess Button
      document.write("</div>");
      // Build the game board
      buildGameBoard();
      // Start the first game
      playNewGame();
    </script>
  </body>
</html>
